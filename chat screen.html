<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chattera — Chat</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

:root {
    --primary: #5b4bdb;
    --primary-light: #eeeaff;
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #17172b;
    --muted: #85879a;
    --border: #ececf3;
    --incoming: #ffffff;
    --outgoing: #5b4bdb;
    --green: #18a768;
}
<script src="navigation.js"></script>

body {
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
}

.app {
    width: 100%;
    max-width: 600px;
    height: 100vh;
    margin: auto;

    display: flex;
    flex-direction: column;

    background: var(--bg);
}

/* HEADER */

.header {
    height: 70px;

    background: var(--card);

    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;

    padding: 0 12px;

    flex-shrink: 0;

    z-index: 20;
}

.back {
    width: 40px;
    height: 40px;

    border: none;
    border-radius: 13px;

    background: #f1f1f8;

    color: var(--text);

    font-size: 21px;

    cursor: pointer;

    margin-right: 8px;
}

.profile {
    display: flex;
    align-items: center;

    flex: 1;

    cursor: pointer;
}

.avatar {
    width: 43px;
    height: 43px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #5b4bdb,
            #887bea
        );

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    font-weight: bold;

    margin-right: 10px;

    position: relative;
}

.online-dot {
    position: absolute;

    width: 10px;
    height: 10px;

    border: 2px solid var(--card);

    border-radius: 50%;

    background: var(--green);

    right: -1px;
    bottom: -1px;
}

.profile-info strong {
    display: block;

    font-size: 13px;

    margin-bottom: 4px;
}

.profile-info span {
    color: var(--green);

    font-size: 9px;
}

.header-actions {
    display: flex;
    gap: 5px;
}

.header-btn {
    width: 38px;
    height: 38px;

    border: none;
    border-radius: 12px;

    background: transparent;

    color: var(--text);

    font-size: 18px;

    cursor: pointer;
}

.header-btn:hover {
    background: var(--primary-light);
}

/* CHAT AREA */

.chat-area {
    flex: 1;

    overflow-y: auto;

    padding: 18px 14px 14px;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(91,75,219,.035),
            transparent 30%
        ),
        var(--bg);
}

.date-divider {
    text-align: center;

    margin: 5px 0 18px;
}

.date-divider span {
    display: inline-block;

    padding: 6px 11px;

    border-radius: 10px;

    background: rgba(91,75,219,.08);

    color: var(--muted);

    font-size: 9px;

    font-weight: bold;
}

/* MESSAGE */

.message-row {
    display: flex;

    margin-bottom: 8px;
}

.message-row.outgoing {
    justify-content: flex-end;
}

.message-row.incoming {
    justify-content: flex-start;
}

.message {
    max-width: 78%;

    padding: 10px 12px;

    border-radius: 16px;

    position: relative;

    box-shadow:
        0 1px 2px rgba(0,0,0,.025);
}

.incoming .message {
    background: var(--incoming);

    border: 1px solid var(--border);

    border-bottom-left-radius: 5px;
}

.outgoing .message {
    background: var(--outgoing);

    color: white;

    border-bottom-right-radius: 5px;
}

.message-text {
    font-size: 12px;

    line-height: 1.45;

    padding-right: 35px;
}

.message-meta {
    display: flex;

    justify-content: flex-end;
    align-items: center;

    gap: 4px;

    margin-top: 5px;
}

.message-time {
    font-size: 8px;

    opacity: .65;
}

.checks {
    font-size: 10px;

    color: #bdb7ff;
}

/* IMAGE MESSAGE */

.image-message {
    padding: 4px !important;
}

.chat-image {
    width: 220px;
    max-width: 100%;

    border-radius: 12px;

    display: block;
}

.image-message .message-meta {
    padding: 0 5px 3px;
}

/* TYPING */

.typing {
    display: none;

    align-items: center;

    margin: 5px 0 8px;
}

.typing.show {
    display: flex;
}

.typing-bubble {
    background: var(--incoming);

    border: 1px solid var(--border);

    border-radius: 16px;

    border-bottom-left-radius: 5px;

    padding: 10px 13px;
}

.typing-dots {
    display: flex;
    gap: 3px;
}

.typing-dots span {
    width: 5px;
    height: 5px;

    background: #aaaaba;

    border-radius: 50%;

    animation: typing 1.1s infinite;
}

.typing-dots span:nth-child(2) {
    animation-delay: .15s;
}

.typing-dots span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%, 60%, 100% {
        transform: translateY(0);
    }

    30% {
        transform: translateY(-4px);
    }
}

/* INPUT */

.input-area {
    background: var(--card);

    border-top: 1px solid var(--border);

    padding: 9px 10px;

    flex-shrink: 0;
}

.input-row {
    display: flex;

    align-items: flex-end;

    gap: 6px;
}

.input-box {
    flex: 1;

    min-height: 44px;
    max-height: 110px;

    display: flex;
    align-items: center;

    background: var(--bg);

    border: 1px solid var(--border);

    border-radius: 16px;

    padding: 4px 6px;
}

.input-btn {
    width: 34px;
    height: 34px;

    border: none;

    background: transparent;

    color: var(--muted);

    border-radius: 10px;

    font-size: 18px;

    cursor: pointer;

    flex-shrink: 0;
}

.input-btn:hover {
    background: var(--primary-light);

    color: var(--primary);
}

.message-input {
    flex: 1;

    min-width: 0;

    max-height: 95px;

    border: none;

    outline: none;

    background: transparent;

    color: var(--text);

    resize: none;

    font-size: 12px;

    line-height: 1.45;

    padding: 8px 5px;
}

.message-input::placeholder {
    color: var(--muted);
}

.send-btn {
    width: 44px;
    height: 44px;

    border: none;

    border-radius: 15px;

    background: var(--primary);

    color: white;

    font-size: 18px;

    cursor: pointer;

    flex-shrink: 0;

    transition: .2s;
}

.send-btn:hover {
    transform: scale(1.04);
}

.send-btn.recording {
    background: #df4d5d;
}

/* ATTACHMENT MENU */

.attach-menu {
    display: none;

    position: absolute;

    bottom: 70px;

    left: 10px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 8px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.12);

    width: 190px;

    z-index: 30;
}

.attach-menu.show {
    display: block;
}

.attach-option {
    width: 100%;

    border: none;

    background: transparent;

    color: var(--text);

    display: flex;

    align-items: center;

    padding: 10px;

    border-radius: 11px;

    cursor: pointer;

    text-align: left;

    font-size: 11px;
}

.attach-option:hover {
    background: var(--primary-light);
}

.attach-icon {
    width: 32px;
    height: 32px;

    border-radius: 10px;

    background: var(--primary-light);

    color: var(--primary);

    display: flex;

    align-items: center;
    justify-content: center;

    margin-right: 9px;

    font-size: 15px;
}

/* EMOJI PANEL */

.emoji-panel {
    display: none;

    position: absolute;

    bottom: 70px;

    left: 10px;
    right: 10px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 18px;

    padding: 12px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.12);

    z-index: 30;
}

.emoji-panel.show {
    display: block;
}

.emojis {
    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    gap: 7px;
}

.emoji {
    border: none;

    background: transparent;

    font-size: 21px;

    padding: 5px;

    border-radius: 8px;

    cursor: pointer;
}

.emoji:hover {
    background: var(--primary-light);
}

/* MODAL */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.45);

    z-index: 100;

    align-items: flex-end;

    justify-content: center;
}

.modal.show {
    display: flex;
}

.modal-content {
    width: 100%;

    max-width: 600px;

    background: var(--card);

    border-radius: 25px 25px 0 0;

    padding: 22px 20px 30px;

    animation: slideUp .25s ease;
}

@keyframes slideUp {
    from {
        transform: translateY(100%);
    }

    to {
        transform: translateY(0);
    }
}

.modal-head {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 17px;
}

.modal-head h3 {
    font-size: 18px;
}

.close {
    width: 35px;
    height: 35px;

    border: none;

    border-radius: 11px;

    background: #f1f1f8;

    color: var(--text);

    font-size: 19px;

    cursor: pointer;
}

.call-options {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

.call-option {
    border: 1px solid var(--border);

    background: var(--bg);

    color: var(--text);

    border-radius: 15px;

    padding: 18px 10px;

    cursor: pointer;

    text-align: center;
}

.call-option-icon {
    font-size: 25px;

    margin-bottom: 8px;
}

.call-option strong {
    display: block;

    font-size: 11px;
}

/* DARK */

body.dark {
    --bg: #11111b;
    --card: #191925;
    --text: #f4f4fa;
    --muted: #9293a7;
    --border: #29293a;
    --incoming: #20202e;
}

body.dark .back,
body.dark .close {
    background: #272738;
}

body.dark .attach-menu,
body.dark .emoji-panel {
    box-shadow:
        0 10px 35px rgba(0,0,0,.4);
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <button
            class="back"
            onclick="goBack()">
            ←
        </button>

        <div
            class="profile"
            onclick="openProfile()">

            <div class="avatar">

                AJ

                <span class="online-dot"></span>

            </div>

            <div class="profile-info">

                <strong>
                    Amara Johnson
                </strong>

                <span id="status">
                    online
                </span>

            </div>

        </div>

        <div class="header-actions">

            <button
                class="header-btn"
                onclick="openCall('Voice Call')">
                📞
            </button>

            <button
                class="header-btn"
                onclick="openCall('Video Call')">
                🎥
            </button>

            <button
                class="header-btn"
                onclick="openChatMenu()">
                ⋮
            </button>

        </div>

    </header>


    <!-- CHAT -->

    <main
        class="chat-area"
        id="chatArea">

        <div class="date-divider">
            <span>
                TODAY
            </span>
        </div>


        <!-- INCOMING -->

        <div class="message-row incoming">

            <div class="message">

                <div class="message-text">
                    Hey! How are you doing today?
                </div>

                <div class="message-meta">

                    <span class="message-time">
                        9:41 AM
                    </span>

                </div>

            </div>

        </div>


        <!-- OUTGOING -->

        <div class="message-row outgoing">

            <div class="message">

                <div class="message-text">
                    I'm doing great 😊 How about you?
                </div>

                <div class="message-meta">

                    <span class="message-time">
                        9:42 AM
                    </span>

                    <span class="checks">
                        ✓✓
                    </span>

                </div>

            </div>

        </div>


        <!-- INCOMING -->

        <div class="message-row incoming">

            <div class="message">

                <div class="message-text">
                    I'm good too. I wanted to tell you
                    something.
                </div>

                <div class="message-meta">

                    <span class="message-time">
                        9:43 AM
                    </span>

                </div>

            </div>

        </div>


        <!-- OUTGOING -->

        <div class="message-row outgoing">

            <div class="message">

                <div class="message-text">
                    Sure 😊 I'm listening.
                </div>

                <div class="message-meta">

                    <span class="message-time">
                        9:44 AM
                    </span>

                    <span class="checks">
                        ✓✓
                    </span>

                </div>

            </div>

        </div>


        <!-- TYPING -->

        <div
            class="typing"
            id="typing">

            <div class="typing-bubble">

                <div class="typing-dots">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </div>

    </main>


    <!-- ATTACHMENT MENU -->

    <div
        class="attach-menu"
        id="attachMenu">

        <button
            class="attach-option"
            onclick="selectAttachment('Photo')">

            <span class="attach-icon">
                🖼
            </span>

            Photo & Video

        </button>

        <button
            class="attach-option"
            onclick="selectAttachment('Document')">

            <span class="attach-icon">
                📄
            </span>

            Document

        </button>

        <button
            class="attach-option"
            onclick="selectAttachment('Location')">

            <span class="attach-icon">
                📍
            </span>

            Location

        </button>

        <button
            class="attach-option"
            onclick="selectAttachment('Contact')">

            <span class="attach-icon">
                👤
            </span>

            Contact

        </button>

    </div>


    <!-- EMOJI -->

    <div
        class="emoji-panel"
        id="emojiPanel">

        <div class="emojis">

            <button class="emoji">😀</button>
            <button class="emoji">😂</button>
            <button class="emoji">😍</button>
            <button class="emoji">🥰</button>
            <button class="emoji">😘</button>
            <button class="emoji">😊</button>
            <button class="emoji">😎</button>
            <button class="emoji">🤔</button>
            <button class="emoji">😢</button>
            <button class="emoji">😭</button>
            <button class="emoji">😡</button>
            <button class="emoji">❤️</button>
            <button class="emoji">💕</button>
            <button class="emoji">🔥</button>
            <button class="emoji">👍</button>
            <button class="emoji">🙏</button>

        </div>

    </div>


    <!-- INPUT -->

    <footer class="input-area">

        <div class="input-row">

            <div class="input-box">

                <button
                    class="input-btn"
                    onclick="toggleEmoji()">
                    😊
                </button>

                <textarea
                    id="messageInput"
                    class="message-input"
                    rows="1"
                    placeholder="Type a message..."
                    oninput="handleTyping()"></textarea>

                <button
                    class="input-btn"
                    onclick="toggleAttachment()">
                    📎
                </button>

            </div>

            <button
                class="send-btn"
                id="sendButton"
                onclick="sendOrRecord()">
                🎤
            </button>

        </div>

    </footer>

</div>


<!-- CALL MODAL -->

<div
    class="modal"
    id="callModal"
    onclick="closeOutside(event)">

    <div class="modal-content">

        <div class="modal-head">

            <h3>
                Start a call
            </h3>

            <button
                class="close"
                onclick="closeModal()">
                ×
            </button>

        </div>

        <div class="call-options">

            <button
                class="call-option"
                onclick="startCall('Voice')">

                <div class="call-option-icon">
                    📞
                </div>

                <strong>
                    Voice Call
                </strong>

            </button>

            <button
                class="call-option"
                onclick="startCall('Video')">

                <div class="call-option-icon">
                    🎥
                </div>

                <strong>
                    Video Call
                </strong>

            </button>

        </div>

    </div>

</div>


<script>

/* BACK */

function goBack() {
    window.history.back();
}


/* PROFILE */

function openProfile() {
    alert(
        "Amara Johnson's profile will open here."
    );
}


/* CALL */

function openCall(type) {

    document
        .getElementById("callModal")
        .classList.add("show");

}


function startCall(type) {

    closeModal();

    alert(
        type +
        " call with Amara Johnson will start here."
    );

}


/* CHAT MENU */

function openChatMenu() {

    alert(
        "Chat options:\n\n" +
        "Search messages\n" +
        "Media, links & documents\n" +
        "Mute notifications\n" +
        "Disappearing messages\n" +
        "Clear chat\n" +
        "Block contact"
    );

}


/* SEND */

function sendOrRecord() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) {

        startRecording();

        return;

    }

    sendMessage(text);

}


function sendMessage(text) {

    const chat =
        document.getElementById(
            "chatArea"
        );

    const row =
        document.createElement("div");

    row.className =
        "message-row outgoing";

    row.innerHTML = `

        <div class="message">

            <div class="message-text">
                ${escapeHTML(text)}
            </div>

            <div class="message-meta">

                <span class="message-time">
                    ${currentTime()}
                </span>

                <span class="checks">
                    ✓
                </span>

            </div>

        </div>

    `;

    chat.insertBefore(
        row,
        document.getElementById("typing")
    );

    document.getElementById(
        "messageInput"
    ).value = "";

    document.getElementById(
        "sendButton"
    ).textContent = "🎤";

    autoResize();

    chat.scrollTop =
        chat.scrollHeight;

    /*
       Firebase integration will eventually
       save this message to the chat room.
    */

    simulateReply();

}


/* SIMULATED REPLY */

function simulateReply() {

    document
        .getElementById("typing")
        .classList.add("show");

    const chat =
        document.getElementById(
            "chatArea"
        );

    chat.scrollTop =
        chat.scrollHeight;

    setTimeout(() => {

        document
            .getElementById("typing")
            .classList.remove("show");

        addIncomingMessage(
            "That's great 😊"
        );

    }, 1600);

}


function addIncomingMessage(text) {

    const chat =
        document.getElementById(
            "chatArea"
        );

    const row =
        document.createElement("div");

    row.className =
        "message-row incoming";

    row.innerHTML = `

        <div class="message">

            <div class="message-text">
                ${escapeHTML(text)}
            </div>

            <div class="message-meta">

                <span class="message-time">
                    ${currentTime()}
                </span>

            </div>

        </div>

    `;

    chat.insertBefore(
        row,
        document.getElementById("typing")
    );

    chat.scrollTop =
        chat.scrollHeight;

}


/* RECORDING */

function startRecording() {

    const button =
        document.getElementById(
            "sendButton"
        );

    button.classList.add(
        "recording"
    );

    button.textContent = "■";

    setTimeout(() => {

        button.classList.remove(
            "recording"
        );

        button.textContent = "🎤";

        alert(
            "Voice recording demo completed."
        );

    }, 1500);

}


/* TYPING */

function handleTyping() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const button =
        document.getElementById(
            "sendButton"
        );

    button.textContent =
        input.value.trim()
            ? "➤"
            : "🎤";

    autoResize();

}


function autoResize() {

    const input =
        document.getElementById(
            "messageInput"
        );

    input.style.height = "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            95
        ) + "px";

}


/* EMOJI */

function toggleEmoji() {

    const panel =
        document.getElementById(
            "emojiPanel"
        );

    document
        .getElementById("attachMenu")
        .classList.remove("show");

    panel.classList.toggle("show");

}


document
    .querySelectorAll(".emoji")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                const input =
                    document.getElementById(
                        "messageInput"
                    );

                input.value +=
                    this.textContent;

                input.focus();

                handleTyping();

            }
        );

    });


/* ATTACHMENTS */

function toggleAttachment() {

    const menu =
        document.getElementById(
            "attachMenu"
        );

    document
        .getElementById("emojiPanel")
        .classList.remove("show");

    menu.classList.toggle("show");

}


function selectAttachment(type) {

    document
        .getElementById("attachMenu")
        .classList.remove("show");

    alert(
        type +
        " attachment will be handled here."
    );

}


/* MODAL */

function closeModal() {

    document
        .getElementById("callModal")
        .classList.remove("show");

}


function closeOutside(event) {

    if (
        event.target.id === "callModal"
    ) {

        closeModal();

    }

}


/* TIME */

function currentTime() {

    return new Date().toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


/* SECURITY */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* INITIAL SCROLL */

window.addEventListener(
    "load",
    function() {

        const chat =
            document.getElementById(
                "chatArea"
            );

        chat.scrollTop =
            chat.scrollHeight;

    }
);

</script>

</body>
</html>
