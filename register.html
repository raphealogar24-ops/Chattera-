<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chattera – Create Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

<script src="navigation.js"></script>
body{
    min-height:100vh;
    background:linear-gradient(180deg,#0b141a,#111b21);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.card{
    background:rgba(32,44,51,0.95);
    border-radius:25px;
    padding:30px;
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    color:#25D366;
    font-size:42px;
}

.logo p{
    color:#d1d5db;
    margin-top:8px;
}

.upload-box{
    text-align:center;
    margin-bottom:25px;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid #25D366;
    overflow:hidden;
    margin:auto;
    background:#2a3942;
    display:flex;
    justify-content:center;
    align-items:center;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.plus{
    color:#25D366;
    font-size:40px;
}

.file-input{
    margin-top:15px;
    color:white;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    color:white;
    margin-bottom:8px;
}

.input-group input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:14px;
    background:#2a3942;
    color:white;
}

.input-group input:focus{
    border:2px solid #25D366;
}

.button{
    width:100%;
    border:none;
    border-radius:14px;
    padding:16px;
    background:#25D366;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#d1d5db;
}

.footer a{
    color:#25D366;
    text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>Chattera</h1>
        <p>Connect instantly with friends.</p>
    </div>

    <div class="card">

        <div class="upload-box">

            <div class="avatar">
                <img id="preview" src="" alt="">
                <span id="plus" class="plus">+</span>
            </div>

            <input
                class="file-input"
                type="file"
                id="profileImage"
                accept="image/*">

        </div>

        <div class="input-group">
            <label>Full name</label>
            <input type="text" placeholder="Enter your full name">
        </div>

        <div class="input-group">
            <label>Email address</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create your password">
        </div>

        <div class="input-group">
            <label>Confirm password</label>
            <input type="password" placeholder="Confirm your password">
        </div>

        <button class="button">Create Account</button>

        <div class="footer">
            Already have an account?
            <a href="#">Log in</a>
        </div>

    </div>

</div>

<script>

const imageInput = document.getElementById("profileImage");
const preview = document.getElementById("preview");
const plus = document.getElementById("plus");

imageInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {
        preview.src = event.target.result;
        plus.style.display = "none";
    };

    reader.readAsDataURL(file);

});

</script>

</body>
</html>
